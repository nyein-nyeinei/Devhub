{% extends "base.html" %}
{% block content %}

<div class="flex justify-center items-center my-10">
    
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-gray-100">
        
        <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-2">Create Account</h2>
        <p class="text-sm text-gray-500 text-center mb-8">Join DevHub to share and learn resources</p>

        <form action="/register" method="POST" class="space-y-5">
            
            <!-- Username Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required autocomplete="off"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <!-- Email Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>

            <!-- 🌟 Password Input with Eye Toggle -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative flex items-center">
                    <input type="password" name="password" id="passwordInput"
                           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                           title="Password သည် အနည်းဆုံး ၈ လုံး ရှိရမည်ဖြစ်ပြီး စာလုံးကြီး (A-Z) နှင့် ဂဏန်း (0-9) အနည်းဆုံး တစ်လုံးစီ ပါဝင်ရပါမည်။"
                           required autocomplete="new-password"
                           placeholder="Min 8 chars, 1 uppercase, 1 number"
                           class="w-full px-4 py-2.5 pr-12 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    
                    <button type="button" id="togglePassword" class="absolute right-4 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <!-- မျက်လုံးဖွင့်ထားသည့် SVG -->
                        <svg xmlns="http://www.w3.org/2000/svg" id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>
                <p class="text-xs text-gray-400 mt-1.5">Must contain at least 8 characters, 1 uppercase letter, and 1 number.</p>
            </div>

            <!-- Account Type Select -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">I am a ...</label>
                <select name="account_type" 
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                    <option value="ucsm">UCSM Student (ကျောင်းသား)</option>
                    <option value="alumni">UCSM Alumni (ကျောင်းပြီးသူ)</option>
                    <option value="self_learner">Self Learner (ပြင်ပလေ့လာသူ)</option>
                </select>
            </div>

            <button type="submit" 
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-md hover:shadow-lg mt-4">
                Sign Up
            </button>
        </form>

        <p class="text-sm text-center text-gray-600 mt-6">
            Already have an account? 
            <a href="/login" class="text-indigo-600 font-semibold hover:underline">Log in</a>
        </p>
    </div>
</div>

<!-- JavaScript Logic -->
<script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePassword && passwordInput && eyeIcon) {
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />`;
            } else {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />`;
            }
        });
    }
</script>

{% endblock %}
